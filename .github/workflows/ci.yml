name: Ověření wiki
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        include:
          - site: https://aion2.tarot-club.cz
            base: /
          - site: https://oldbear24.github.io
            base: /tarot-club-aion2/
    env:
      SITE_URL: ${{ matrix.site }}
      BASE_PATH: ${{ matrix.base }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
