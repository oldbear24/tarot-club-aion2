name: Nasazení na GitHub Pages
on:
  workflow_dispatch:
    inputs:
      closed_pr:
        description: Číslo právě zavřeného PR (0 pro běžné nasazení)
        type: number
        default: 0
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: read
      actions: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      artifact_name: ${{ steps.artifact-name.outputs.name }}
      previews: ${{ steps.previews.outputs.manifest }}
      site: ${{ steps.pages.outputs.origin }}
      base: ${{ steps.pages.outputs.base_path }}/
    steps:
      - uses: actions/checkout@v6
        with:
          # Privileged publishing always uses trusted main, never PR scripts.
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/configure-pages@v5
        id: pages
      - name: Název balíčku pro tento pokus
        id: artifact-name
        run: printf 'name=github-pages-%s-%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run verify
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - name: Připojit náhledy otevřených PR
        id: previews
        run: node scripts/pages-previews.mjs assemble
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@v4
        with:
          name: ${{ steps.artifact-name.outputs.name }}
          path: dist
  deploy:
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
      deployments: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/deploy-pages@v4
        id: deployment
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
      - name: Odkazy na náhledy v deployments PR
        run: node scripts/pages-previews.mjs deployments
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PREVIEW_MANIFEST: ${{ needs.build.outputs.previews }}
          SITE_URL: ${{ needs.build.outputs.site }}
          BASE_PATH: ${{ needs.build.outputs.base }}
          CLOSED_PR: ${{ inputs.closed_pr }}
