name: Náhled pull requestu
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
permissions:
  contents: read
  pages: read
concurrency:
  group: preview-build-${{ github.event.number }}
  cancel-in-progress: true
jobs:
  build:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          # PR builds do not share a writable cache with the trusted publisher.
      - uses: actions/configure-pages@v5
        id: pages
      - run: npm ci
      - run: npm run verify
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/pr-preview/pr-${{ github.event.number }}/
      - uses: actions/upload-artifact@v7
        with:
          name: pr-preview-${{ github.event.number }}
          path: dist
          if-no-files-found: error
          retention-days: 90
