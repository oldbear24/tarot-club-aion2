name: Dostupnost zdrojů (informativní)
on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 1'
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check:sources
